# Gradle configuration (mirrors SBO-Kotlin)
org.gradle.jvmargs=-Xss512k -Xms2m -Xmx2g -XX:MaxDirectMemorySize=512m -XX:ReservedCodeCacheSize=384m -XX:+UseStringDeduplication -XX:+UseParallelGC -XX:+PerfDisableSharedMem -Djdk.util.jar.enableMultiRelease=force -Duser.language=en -Duser.country=US -XX:TieredStopAtLevel=1 -XX:+UnlockExperimentalVMOptions -XX:+UseCompactObjectHeaders
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# loom
fabric.loom.dropNonIntermediateRootMethods=true

# DGT
dgt.minecraft.revision=7
dgt.loom.minecraft.setup=false
dgt.loom.mappings.use=false
dgt.loom.loader.use=false

# Mod properties
mod.name=GuiLib
mod.id=guilib
mod.version=0.3.0
mod.group=net.sbo.guilib
mod.description=Web-style UI library (React-like Kotlin DSL + CSS) for Minecraft mods.

mc26.1.2.constraint=~26.1

# Java
java.version.26.1.2=25
java.version.26.2=25

fabricloader.version=0.19.5
fabriclanguagekotlin.version=1.14.1+kotlin.2.4.20

fabricapi.version.26.1.2=0.155.3+26.1.2
fabricapi.version.26.2=0.161.0+26.2

devauth.version=1.2.2
